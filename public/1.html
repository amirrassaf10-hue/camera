<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>1</title><body style="background:#111;color:white;text-align:center;font-family:Arial"><h2>1 - فرستنده</h2><input id="r" placeholder="کد اتاق"><button id="b">شروع</button><p id="s">آماده</p><video id="v" autoplay playsinline muted style="max-width:95%"></video><script src="/socket.io/socket.io.js"></script><script>
const q=id=>document.getElementById(id),iox=io();let pc,st,room;
const cfg={iceServers:[{urls:"stun:stun.l.google.com:19302"}]};
function msg(x){q("s").textContent=x}
q("b").onclick=async()=>{room=q("r").value.trim();if(!room)return msg("کد اتاق را وارد کن.");if(!isSecureContext)return msg("HTTPS لازم است.");try{st=await navigator.mediaDevices.getUserMedia({video:true,audio:true});q("v").srcObject=st;pc=new RTCPeerConnection(cfg);st.getTracks().forEach(t=>pc.addTrack(t,st));pc.onicecandidate=e=>e.candidate&&iox.emit("signal",{room,data:{t:"c",c:e.candidate}});iox.on("signal",async d=>{if(d.t==="a")await pc.setRemoteDescription({type:"answer",sdp:d.s});if(d.t==="c")await pc.addIceCandidate(d.c)});iox.once("peer-joined",async()=>{let o=await pc.createOffer();await pc.setLocalDescription(o);iox.emit("signal",{room,data:{t:"o",s:o.sdp}});msg("درخواست اتصال ارسال شد.")});iox.emit("join",room);msg("منتظر نفر دوم...")}catch(e){msg("دسترسی دوربین/میکروفون رد شد.")}};
</script></body></html>
