<!doctype html><html lang="fa" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>2</title><body style="background:#111;color:white;text-align:center;font-family:Arial"><h2>2 - گیرنده</h2><input id="r" placeholder="کد اتاق"><button id="b">اتصال</button><button id="sound">صدا</button><p id="s">آماده</p><video id="v" autoplay playsinline style="max-width:95%"></video><script src="/socket.io/socket.io.js"></script><script>
const q=id=>document.getElementById(id),iox=io();let pc,room;const cfg={iceServers:[{urls:"stun:stun.l.google.com:19302"}]};
function msg(x){q("s").textContent=x}
q("b").onclick=()=>{room=q("r").value.trim();if(!room)return msg("کد اتاق را وارد کن.");pc=new RTCPeerConnection(cfg);pc.ontrack=e=>{q("v").srcObject=e.streams[0];msg("تصویر و صدا دریافت شد.")};pc.onicecandidate=e=>e.candidate&&iox.emit("signal",{room,data:{t:"c",c:e.candidate}});iox.on("signal",async d=>{if(d.t==="o"){await pc.setRemoteDescription({type:"offer",sdp:d.s});let a=await pc.createAnswer();await pc.setLocalDescription(a);iox.emit("signal",{room,data:{t:"a",s:a.sdp}})}if(d.t==="c")await pc.addIceCandidate(d.c)});iox.emit("join",room);msg("منتظر نفر اول...")};q("sound").onclick=()=>q("v").play().catch(()=>{});
</script></body></html>
